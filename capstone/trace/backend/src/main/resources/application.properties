spring.application.name=trace-backend

# Server
server.port=8080
server.address=127.0.0.1

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/trace
spring.datasource.username=trace_runtime
spring.datasource.password=${TRACE_RUNTIME_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=trace_migrator
spring.flyway.password=${TRACE_MIGRATION_PASSWORD}

trace.processor.url=${TRACE_PROCESSOR_URL:http://127.0.0.1:8000}

# Bounded in-memory multipart files; never use a client-supplied filesystem path.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB
server.error.include-message=never
server.error.include-stacktrace=never

# Health
management.endpoints.web.exposure.include=health,info

# Cookie sessions: a single backend instance; restart signs users out.
server.servlet.session.timeout=${TRACE_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${TRACE_SECURE_COOKIES:false}
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=6MB
trace.security.bcrypt-strength=12
trace.security.password-min-length=12
trace.security.local-token-delivery=false

# Unverified public signup is disabled outside the exclusive loopback local-dev profile.
trace.security.local-signup-enabled=false

# Private environment configuration; never put these values in source control.
trace.connectors.encryption-key=${TRACE_CONNECTOR_ENCRYPTION_KEY:}
trace.processor.token=${TRACE_PROCESSOR_TOKEN:}

# Process liveness is independent of database/parser readiness and vendor connectivity.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,parser
management.endpoint.health.group.database.include=db
management.endpoint.health.group.processor.include=parser
