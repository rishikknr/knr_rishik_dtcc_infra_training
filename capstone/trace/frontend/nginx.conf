# Only host-loopback port 8080 is used by cloudflared. The public port 80
# never trusts a client's forwarded scheme. cloudflared supplies a single value.
map "$server_port:$http_x_forwarded_proto" $trace_scheme {
    default $scheme;
    "8080:https" https;
}


server {
    listen 80;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $trace_scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
