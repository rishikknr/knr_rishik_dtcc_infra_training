name: TRACE Staging CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trace-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 117889972903.dkr.ecr.ap-south-1.amazonaws.com
      INSTANCE_ID: ${{ vars.TRACE_EC2_INSTANCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Spring Boot backend
        run: mvn -B -f backend/pom.xml test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test and build React
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test
          npm --prefix frontend run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python processor
        env:
          PYTHONPATH: processor
        run: |
          python -m pip install -r processor/requirements.txt pytest
          python -m pytest -q processor/tests

      - name: Authenticate with AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::117889972903:role/trace-staging-github-deploy-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker images
        run: |
          set -euo pipefail

          for app in frontend backend processor; do
            repo="trace-staging-$app"
            image="$ECR_REGISTRY/$repo:$GITHUB_SHA"

            if aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids "imageTag=$GITHUB_SHA" \
              >/dev/null 2>&1; then
              echo "Image already exists: $image"
              continue
            fi

            docker build \
              -f "$app/Dockerfile" \
              -t "$image" .

            docker push "$image"
          done

      - name: Start EC2 if stopped
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID"

          state=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          case "$state" in
            stopped)
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
              ;;
            running)
              echo "EC2 already running"
              ;;
            *)
              echo "Unexpected EC2 state: $state"
              exit 1
              ;;
          esac

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

      - name: Prepare SSM deployment command
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          encoded = base64.b64encode(
              Path("compose.prod.yml").read_bytes()
          ).decode("ascii")
          sha = os.environ["GITHUB_SHA"]

          commands = [
              "set -eu",
              "umask 077",
              "test -s /opt/trace/secrets/backend.env",
              "test -s /opt/trace/secrets/processor.env",
              "docker network inspect trace_default >/dev/null",
              "install -d -m 750 /opt/trace",
              f"printf '%s' '{encoded}' | base64 -d > /opt/trace/compose.prod.yml.tmp",
              "mv /opt/trace/compose.prod.yml.tmp /opt/trace/compose.prod.yml",
              f"printf 'TRACE_IMAGE_TAG=%s\\n' '{sha}' > /opt/trace/deploy.env",
              "cd /opt/trace",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 117889972903.dkr.ecr.ap-south-1.amazonaws.com",
              "docker compose --env-file deploy.env -f compose.prod.yml config --quiet",
              "docker compose --env-file deploy.env -f compose.prod.yml pull",
              "docker compose --env-file deploy.env -f compose.prod.yml up -d",
          ]

          commands.extend("""
          echo 'Waiting for TRACE backend readiness...'
          backend_ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8081/actuator/health/readiness; then
              echo "Backend ready on attempt $attempt"
              backend_ready=1
              break
            fi
            echo "Backend not ready ($attempt/30)"
            sleep 3
          done
          if [ "$backend_ready" -ne 1 ]; then
            echo 'Backend did not become ready; recent logs:'
            docker logs --tail=100 trace-app-backend-1 || true
            exit 1
          fi

          echo 'Checking TRACE frontend...'
          frontend_ready=0
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/; then
              echo "Frontend ready on attempt $attempt"
              frontend_ready=1
              break
            fi
            echo "Frontend not ready ($attempt/10)"
            sleep 3
          done
          if [ "$frontend_ready" -ne 1 ]; then
            echo 'Frontend did not become ready; recent logs:'
            docker logs --tail=100 trace-app-frontend-1 || true
            exit 1
          fi

          echo 'TRACE deployment health checks passed'
          """.strip().splitlines())

          request = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [os.environ["INSTANCE_ID"]],
              "TimeoutSeconds": 1800,
              "Parameters": {"commands": commands},
          }
          Path("ssm-deployment.json").write_text(json.dumps(request))
          PY

      - name: Deploy on EC2 through SSM
        run: |
          set -euo pipefail

          command_id=""

          for attempt in $(seq 1 12); do
            if command_id=$(aws ssm send-command \
              --cli-input-json file://ssm-deployment.json \
              --query 'Command.CommandId' \
              --output text); then
              break
            fi

            echo "Waiting for SSM agent... ($attempt/12)"
            sleep 10
          done

          test -n "$command_id"

          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                echo "TRACE deployed successfully"
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated)
                echo "SSM deployment ended with status: $status"
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true

          exit 1
